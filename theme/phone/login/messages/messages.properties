# Phone authenticator messages —— 基础 bundle（无 locale 后缀）。
# Keycloak 按生效 locale 解析 message key；生产 realm 默认 locale 是 en，
# 只有 messages_zh_CN 时 en 下会直接吐原始 key（doGetVerificationCode / otp.wrong …）。
# 这份无后缀 bundle 是所有 locale 的最终兜底，保证服务端错误也能出中文。
phone.required=手机号不能为空
phone.invalid=请输入正确的手机号
sms.failed=短信发送失败，请稍候重试
otp.expired=验证码已过期，请重新获取
otp.wrong=验证码错误，还有 {0} 次机会
otp.locked=错误次数过多，请重新登录
otp.sent=验证码已重新发送
doGetVerificationCode=获取验证码
doVerify=验证登录
doResend=重新发送
scan.initFailed=二维码生成失败，请稍后重试
