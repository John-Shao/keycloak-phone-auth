# 静态资源版本号（缓存击穿）。
# ${url.resourcesPath} 只按 Keycloak 版本号分版、不看文件内容，同版本(25.0)重建镜像
# URL 不变 → 浏览器命中默认 30 天强缓存，拿到旧 css/js（.ftl 是服务端渲染不受影响，
# 于是出现「新模板 + 旧脚本」的错配，例如按钮永远卡在 HTML 里写死的 disabled 上）。
# 规矩：改了 resources/ 下任何 css/js/img，把下面两处版本号一起改成当天日期。
#   ① wmAssetVersion —— 各 .ftl 里 js/img 的 ?v=
#   ② styles 的 ?v=   —— 父模板渲染 <link>，读不到上面那个属性，只能写死
wmAssetVersion=20260803
styles=css/login.css?v=20260803
